# Browser E2E against the deployed dev app (nightly + on demand). Auth = the Clerk test
# account with the fixed test-mode OTP; @clerk/testing mints a bot-protection bypass token,
# which needs the REAL customer-instance keys as repo secrets:
#   E2E_CLERK_PUBLISHABLE_KEY / E2E_CLERK_SECRET_KEY
# Without them the run exits early with a notice (never a false-red). Money-path specs
# additionally need E2E_MFA_TOTP_SECRET (MFA-enrolled test user) and skip until it exists.
name: E2E

on:
  schedule:
    - cron: "0 6 * * *" # nightly 06:00 UTC (03:00 BRT)
  workflow_dispatch:
    inputs:
      base_url:
        description: Target app URL
        default: https://lince-customer.fly.dev

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        id: gate
        run: |
          if [ -z "${{ secrets.E2E_CLERK_SECRET_KEY }}" ]; then
            echo "notice=E2E secrets not configured — add E2E_CLERK_PUBLISHABLE_KEY + E2E_CLERK_SECRET_KEY" >> "$GITHUB_OUTPUT"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.run == 'false'
        run: echo "::notice::${{ steps.gate.outputs.notice }}"
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 24
          cache: npm
      - if: steps.gate.outputs.run == 'true'
        run: npm ci
      - if: steps.gate.outputs.run == 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.gate.outputs.run == 'true'
        run: npx playwright test
        env:
          E2E_BASE_URL: ${{ inputs.base_url || 'https://lince-customer.fly.dev' }}
          E2E_CLERK_PUBLISHABLE_KEY: ${{ secrets.E2E_CLERK_PUBLISHABLE_KEY }}
          E2E_CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
          E2E_MFA_TOTP_SECRET: ${{ secrets.E2E_MFA_TOTP_SECRET }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
