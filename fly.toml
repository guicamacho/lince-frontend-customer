app = "lince-customer"
primary_region = "gru"

[build]
  [build.args]
    # Publishable key is public (inlined into the client bundle anyway).
    NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY = "pk_test_Z2xvd2luZy10ZWFsLTY0LmNsZXJrLmFjY291bnRzLmRldiQ"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  # Server-to-server over the Fly private network (both apps share the 6PN): no Cloudflare
  # hop, and immune to the Access lock going onto api-dev.lincefinance.xyz — Access would 403
  # the BFF's public-hostname calls. The public hostname stays for webhooks + external tooling.
  LINCE_API_URL = "http://lince-api-dev.internal:3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  path = "/api/health"
  interval = "15s"
  timeout = "3s"
  grace_period = "10s"
